    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('ka-card-theme');
          var safeTheme = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.classList.toggle('dark', safeTheme === 'dark');
          document.documentElement.dataset.theme = safeTheme;
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      html { background: #030712; }
      html:not(.dark) { background: #f6faf8; }

      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      #app-boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__logo {
        position: relative;
        z-index: 1;
        width: min(88vw, 400px);
        height: auto;
        object-fit: contain;
        animation: boot-logo-motion 2.4s ease-in-out infinite;
        filter: drop-shadow(0 12px 24px rgb(245 183 0 / 0.32)) drop-shadow(0 0 24px rgb(30 167 255 / 0.26));
      }

      .boot-loader__progress {
        position: absolute;
        z-index: 1;
        bottom: 12vh;
        width: min(42vw, 9rem);
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.14);
      }

      .boot-loader__progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0b5cff, #1ea7ff, #f5b700);
        content: "";
        animation: boot-progress 1.5s ease-in-out infinite;
      }

      @keyframes boot-logo-motion {
        0% {
          transform: translateY(0) scale(0.97);
        }

        50% {
          transform: translateY(-8px) scale(1);
        }

        100% {
          transform: translateY(0) scale(0.97);
        }
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-130%);
        }

        100% {
          transform: translateX(330%);
        }
      }

    </style>

    <div id="app-boot-loader" aria-hidden="true">
      <img class="boot-loader__logo" src="/embrator-og.webp" alt="EMBRATOR CARD" />
      <span class="boot-loader__progress" aria-hidden="true"></span>
    </div>
